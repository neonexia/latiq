[workspace]
resolver = "2"
members = [
  "crates/latiq",
  "crates/latiq-common",
  "crates/latiq-proto",
  "crates/latiq-agent-core",
  "crates/latiq-mcp",
  "crates/latiq-client",
  "crates/latiq-engine",
  "crates/latiq-engine-duckdb",
  "crates/latiq-storage",
  "crates/latiq-pond-node",
  "crates/latiq-control-plane",
  "crates/latiq-metrics",
  "crates/latiq-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
# json + parquet are statically linked into the binary (the "standard" set, no
# runtime INSTALL). httpfs/ducklake/spatial have no cargo feature → loaded from
# the deployment image's extension dir. See crates/latiq-common/src/extensions.rs.
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }
# `query_arrow` is always available in duckdb-rs (its `arrow` dep is non-optional).
# Pin the same arrow major DuckDB pulls (58) so query_arrow's RecordBatch is the
# same type across crates; `ipc` for streaming encode/decode on the wire.
# chrono-tz: format named timezones (DuckLake snapshots() returns TIMESTAMP WITH
# TIME ZONE 'UTC'); without it Arrow's JSON/IPC path errors with "only offset
# based timezones supported without chrono-tz feature".
arrow = { version = "58", features = ["ipc", "json", "chrono-tz"] }
rmcp = { version = "1.7.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "macros"] }
axum = { version = "0.8", features = ["http1"] }
schemars = "0.8"
# Observability. metrics-exporter-prometheus without default features drops its
# hyper http-listener (we serve /metrics ourselves via axum) — no tonic skew.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
sysinfo = "0.32"
