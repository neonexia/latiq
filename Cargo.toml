[workspace]
resolver = "2"
members = [
  "crates/latiq",
  "crates/latiq-common",
  "crates/latiq-proto",
  "crates/latiq-agent-core",
  "crates/latiq-mcp",
  "crates/latiq-client",
  "crates/latiq-engine",
  "crates/latiq-engine-duckdb",
  "crates/latiq-storage",
  "crates/latiq-pond-node",
  "crates/latiq-control-plane",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
duckdb = { version = "1", features = ["bundled"] }
rmcp = { version = "1.7.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "macros"] }
axum = { version = "0.8", features = ["http1"] }
schemars = "0.8"
