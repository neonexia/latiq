[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "latiq"
version = "0.1.0"
description = "Python SDK for Latiq — agent-native data ponds"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pyarrow>=14"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# The cdylib is named `latiq`; build it as the top-level module. maturin
# auto-detects `latiq.pyi` and ships PEP 561 type info (the package layout +
# py.typed) so editors/mypy/pyright see signatures.
module-name = "latiq"
features = ["pyo3/extension-module"]
