[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "latiq"
version = "0.1.0"
description = "Python SDK for Latiq — agent-native data ponds"
# Ship the README as the long description; without it the PyPI project page is
# blank, and it is where `pip install latiq` sends people.
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pyarrow>=14"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

# The wheel ships the server too — `latiq-sdk` links the control plane and the
# pond node (that is what `connect("local")` starts), so all this adds is the
# way to reach them from a shell: `pip install latiq && latiq serve`. The script
# calls into the SAME clap layer the container image runs (crates/latiq).
# NOTE: `latiq-admin` installs a `latiq` script of its own — they are two builds
# of one CLI, so install one or the other, not both, into a single environment.
[project.scripts]
latiq = "latiq:_cli_main"

[tool.maturin]
# The cdylib is named `latiq`; build it as the top-level module. maturin
# auto-detects `latiq.pyi` and ships PEP 561 type info (the package layout +
# py.typed) so editors/mypy/pyright see signatures.
module-name = "latiq"
features = ["pyo3/extension-module"]
