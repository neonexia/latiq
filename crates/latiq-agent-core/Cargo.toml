[package]
name = "latiq-agent-core"
version.workspace = true
edition.workspace = true

[dependencies]
latiq-common = { path = "../latiq-common" }
latiq-storage = { path = "../latiq-storage" }
latiq-engine = { path = "../latiq-engine" }
latiq-control-plane = { path = "../latiq-control-plane" }
latiq-lineage = { path = "../latiq-lineage" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
arrow = { workspace = true }

[dev-dependencies]
latiq-engine-duckdb = { path = "../latiq-engine-duckdb" }
# The HTTP sink, for the two tests that pin "a sink can never fail a query" and
# "the posted bytes are the stored bytes". Dev-only: this crate is
# protocol-neutral (invariant 5) and its `src/` sees only the `EventSink` trait.
latiq-lineage = { path = "../latiq-lineage", features = ["http-sink"] }
# Compliance proof for the events the query path actually emits, validated
# against the schemas vendored once in `latiq-lineage/spec/`. Dev-only: it must
# never ship in the binary.
jsonschema = { workspace = true }
# Parsing the RFC-3339 `eventTime` back out of an emitted event.
chrono = { workspace = true }
# Seeding a real external DuckLake catalog for the `catalog_pull` lineage test.
# The engine's own dependency, used here only to build the source Latiq then
# pulls FROM — a fake catalog would prove nothing about the attached plan.
duckdb = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
