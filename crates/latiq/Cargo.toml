[package]
name = "latiq"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "latiq"
path = "src/main.rs"

[features]
# `server` bundles the server roles (`serve`, `node add`, `warm-extensions`) and
# their heavy deps — control-plane + pond-node, which embed DuckDB. On by default
# (the container/dev binary is all-roles). A client-only build
# (`--no-default-features`) drops DuckDB entirely and keeps just the CLI client
# commands (pond/query/dataset/catalog/stats/node list) — tiny, cross-compiles to
# any platform in seconds. That's the artifact admins install on their laptops.
default = ["server"]
server = ["dep:latiq-control-plane", "dep:latiq-pond-node", "dep:latiq-metrics", "dep:metrics", "dep:latiq-auth"]

[dependencies]
latiq-control-plane = { path = "../latiq-control-plane", optional = true }
# Only the AuthConfig types the `--auth-*` server flags build; the client-only
# build needs none of it (a bearer token is just a header).
latiq-auth = { path = "../latiq-auth", optional = true }
latiq-pond-node = { path = "../latiq-pond-node", optional = true }
latiq-proto = { path = "../latiq-proto" }
latiq-common = { path = "../latiq-common" }
latiq-engine = { path = "../latiq-engine" }
latiq-metrics = { path = "../latiq-metrics", optional = true }
metrics = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
latiq-mcp = { path = "../latiq-mcp" }
latiq-agent-core = { path = "../latiq-agent-core" }
# The harness assembles one pond node by hand (`add_greeter_node`) out of the
# same pieces `build_ops` uses, minus its RegisterNode call — the only way to
# pin which node the control plane places a pond on.
latiq-storage = { path = "../latiq-storage" }
latiq-engine-duckdb = { path = "../latiq-engine-duckdb" }
latiq-client = { path = "../latiq-client" }
# The SDK is the other client of the Data/Stream surface; its bearer-token path
# is exercised against the same harness the gRPC surface tests use.
latiq-sdk = { path = "../latiq-sdk" }
# The in-process fake IdP behind the auth_* surface tests.
latiq-auth = { path = "../latiq-auth", features = ["test-support"] }
# Drives the MCP surface's plain-HTTP bits (well-known metadata + the 401
# challenge), which are not reachable through an MCP client.
reqwest = { workspace = true }
tokio-stream = { workspace = true }
tempfile = { workspace = true }
arrow = { workspace = true }
# Seeds a local external DuckLake catalog in the catalogs e2e test.
duckdb = { workspace = true }
# Holds the events the MCP lineage tool returns to the real OpenLineage spec,
# validated against the schemas vendored once in `latiq-lineage/spec/`.
jsonschema = { workspace = true }
