syntax = "proto3";
package latiq.v1;

// A dataset is a named, namespaced set of external tables an operator curates and
// agents/clients load into a pond. Shared across the Admin (operators add/list),
// Control (a pond node reads the catalog), and Data (load into a pond) surfaces.

message DatasetTableMsg {
  string table_name = 1;   // the table created in the pond
  string source_uri = 2;   // external location (https/s3/... ; public in Slice 1)
  string format = 3;       // parquet | csv | json | auto
}

message DatasetMsg {
  string ref = 1;                       // full reference: "<namespace>.<name>"
  string namespace = 2;                 // dotted path, e.g. "latiq.sample", "hf.acme"
  string name = 3;                      // leaf name, e.g. "tpch"
  string description = 4;
  repeated string tags = 5;             // searchable tags, e.g. "finance", "apple_hr"
  repeated DatasetTableMsg tables = 6;
  string created_by = 7;
  string created_at = 8;
}
