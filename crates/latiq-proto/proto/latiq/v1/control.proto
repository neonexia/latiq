syntax = "proto3";
package latiq.v1;

import "latiq/v1/datasets.proto";

service Control {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc CreatePondAssignment(CreatePondAssignmentRequest) returns (CreatePondAssignmentResponse);
  rpc GetPondLocation(GetPondLocationRequest) returns (GetPondLocationResponse);
  rpc DropPondAssignment(DropPondAssignmentRequest) returns (DropPondAssignmentResponse);
  rpc ListPonds(ListPondsRequest) returns (ListPondsResponse);
  rpc GetPondInfo(GetPondInfoRequest) returns (GetPondInfoResponse);
  // A pond node reads the catalog to load datasets / pull from external catalogs.
  rpc GetDataset(GetDatasetRequest) returns (GetDatasetResponse);
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse);
}

message GetDatasetRequest { string name = 1; }
message GetDatasetResponse { DatasetMsg dataset = 1; }
message ListDatasetsRequest { string query = 1; }
message ListDatasetsResponse { repeated DatasetMsg datasets = 1; }
message GetCatalogRequest { string name = 1; }
message GetCatalogResponse { CatalogMsg catalog = 1; }
message ListCatalogsRequest { string query = 1; }
message ListCatalogsResponse { repeated CatalogMsg catalogs = 1; }

message PondInfoMsg {
  string pond_id = 1; string name = 2; string owner = 3;
  string created_at = 4; string policy_json = 5;
  // Internal endpoint of the node that owns this pond (empty if the node is
  // gone). Lets a node that receives a request resolve the owner and forward.
  string node_endpoint = 6;
  // Resource tier (x-small/small/medium/large/x-large); empty → medium.
  // An unknown name is REJECTED, never run at the default — the tier is
  // reported back by pond describe, so a tolerated typo would be a durable
  // lie about what the pond is.
  string tier = 7;
  // Optional DuckDB extensions the pond loads on open (LOADed from the image).
  repeated string extensions = 8;
  // Agent-discovery text: what this pond is for (empty = none).
  string description = 9;
  // Whether this pond records OpenLineage events as JSONL files in its own
  // `lineage/` directory, read back via the `get_lineage` MCP tool (no SQL
  // sidecar — docs/lineage.md, "Cut: the SQL catalog over the events").
  // Opt-in at creation, fixed for the pond's lifetime; false by default so the
  // default deployment pays nothing.
  bool lineage = 10;
  // Stable id of the node that owns this pond (the registry's `ponds.node_id`,
  // the id that node registered with). THE field a receiving node decides
  // local-vs-forward on: `node_endpoint` above is only how to reach the owner
  // once that decision is made. Comparing addresses instead let a node mistake
  // itself for another node and forward into itself (#89).
  string node_id = 11;
}
message ListPondsRequest { }
message ListPondsResponse { repeated PondInfoMsg ponds = 1; }
message GetPondInfoRequest { string pond_ref = 1; }
message GetPondInfoResponse { PondInfoMsg pond = 1; }

message RegisterNodeRequest { string node_id = 1; string mcp_endpoint = 2; string internal_endpoint = 3; uint32 capacity = 4; }
message RegisterNodeResponse { }
message HeartbeatRequest { string node_id = 1; uint32 pond_count = 2; }
message HeartbeatResponse { }
// The CLI's `pond create` and the SDK's allocate call this directly (they do not
// go through AgentOps), so every per-pond setting must be carried here too.
message CreatePondAssignmentRequest { string name = 1; string owner_identity = 2; string policy_json = 3; string tier = 4; repeated string extensions = 5; string description = 6; bool lineage = 7; }
message CreatePondAssignmentResponse { string pond_id = 1; string assigned_node_endpoint = 2; }
message GetPondLocationRequest { string pond_ref = 1; }
message GetPondLocationResponse { string pond_id = 1; string node_endpoint = 2; }
message DropPondAssignmentRequest { string pond_id = 1; }
message DropPondAssignmentResponse { }
