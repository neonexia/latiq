syntax = "proto3";
package latiq.v1;

// Data/Query surface — for the CLI and SDK (NOT agents; agents use MCP).
// Served by the pond node (it owns the engine + storage). Unary + bounded by
// the inline cap in M1; Arrow Flight SQL streaming for large results is M2.
// Identity is carried in gRPC metadata key `latiq-agent-id` (relaxed; default
// anonymous). Errors are returned as a tonic Status whose code maps from the
// ErrorKind and whose `details` carry the JSON-encoded ErrorEnvelope.
service Data {
  rpc AllocatePond(AllocatePondRequest) returns (AllocatePondResponse);
  rpc DropPond(DropPondRequest) returns (DropPondResponse);
  // NODE-TO-NODE ONLY — no CLI or SDK command maps to this. Allocation is eager:
  // the control plane places the pond, then the node that took the AllocatePond
  // call asks the OWNING node to materialise its storage through here, and rolls
  // the assignment back if that fails. Idempotent by contract — a pond that is
  // already materialised is a success, never a conflict — so it is safe to retry
  // and harmless when it races the lazy ensure-on-first-use path.
  rpc MaterializePond(MaterializePondRequest) returns (MaterializePondResponse);
  rpc DescribePond(DescribePondRequest) returns (JsonResponse);
  rpc ReadQuery(QueryRequest) returns (JsonResponse);
  rpc WriteQuery(QueryRequest) returns (JsonResponse);
  rpc ExplainQuery(QueryRequest) returns (JsonResponse);
  // Copy a dataset's tables into the pond (one CREATE TABLE each).
  rpc LoadDataset(LoadDatasetRequest) returns (JsonResponse);
  // Transient pull from an external catalog: attach (with creds) → run the query
  // (a CREATE TABLE … AS SELECT … FROM <catalog>.…) → detach. Nothing persists.
  rpc CatalogPull(CatalogPullRequest) returns (JsonResponse);
  // Transient attach → list the catalog's tables/columns → detach.
  rpc CatalogDescribe(CatalogDescribeRequest) returns (JsonResponse);
  // READ a pond's OpenLineage trail (newest first). A read, never a switch:
  // lineage stays fixed at pond creation and no RPC can turn it on or off.
  // This exists so a node that does not own the pond can forward to the one
  // that does — the events are files on the node that RAN the query — which is
  // what makes the agent-facing `get_lineage` tool work behind a gateway.
  rpc GetLineage(GetLineageRequest) returns (JsonResponse);
}

// `since` is an INCLUSIVE lower bound and `before` an EXCLUSIVE upper one, both
// RFC 3339; empty means unbounded. `limit` 0 is rejected rather than reinterpreted.
message GetLineageRequest {
  string pond = 1; uint32 limit = 2; string since = 3; string before = 4;
}

message LoadDatasetRequest { string pond = 1; string dataset = 2; }
// params carry runtime --set values (incl. credentials like `token`); merged
// over the catalog's persisted locator params (these win).
message CatalogPullRequest {
  string pond = 1; string catalog = 2; string query = 3;
  map<string, string> params = 4;
}
message CatalogDescribeRequest {
  string pond = 1; string catalog = 2; map<string, string> params = 3;
}

// `lineage` is opt-in per pond and FIXED for the pond's lifetime — there is
// deliberately no enable/disable RPC (turning it on later would leave a hole at
// the start of the provenance record). Proto3 defaults it to false, so an older
// client simply gets a pond with lineage off. `describe_pond`'s JSON reports it
// under `pond.lineage`, so a caller can tell whether the pond has a trail to
// read. Events are OpenLineage JSONL files in the pond's own `lineage/`
// directory, read back through the `get_lineage` MCP tool — there is no SQL
// view over them (docs/lineage.md, "Cut: the SQL catalog over the events").
// name: empty → Latiq generates one (proto3 cannot express an absent string);
// otherwise 1-64 chars of [A-Za-z0-9_-], since it becomes the pond's SQL catalog
// name. tier: empty → medium; an unknown tier is rejected, not defaulted.
message AllocatePondRequest { string name = 1; string policy_json = 2; string tier = 3; bool lineage = 4; }
message AllocatePondResponse { string pond_id = 1; string pond_name = 2; }
message DropPondRequest { string pond = 1; bool confirm = 2; }
message DropPondResponse { }
// No `confirm` and no options: this creates nothing the registry has not
// already decided on, and it can only ever make the pond exist where the
// registry already says it lives.
message MaterializePondRequest { string pond = 1; }
message MaterializePondResponse { }
message DescribePondRequest { string pond = 1; }
// `timeout_ms` is how long the caller is willing to let the statement run.
// Unset (proto3 zero) means the node's default. A value ABOVE the node's
// maximum is CLAMPED, never refused — the query runs at the ceiling — and the
// response's `_meta.timeout_ms` reports what was actually applied, so a clamp
// is never silent. Ignored by ExplainQuery, which does not execute.
message QueryRequest { string pond = 1; string sql = 2; uint64 timeout_ms = 3; }

// Carries a serialized JSON object: for queries `{columns, rows, statement,
// status, _meta}`; for describe `{pond, schema}`.
message JsonResponse { string json = 1; }

// Streaming Arrow read — for the SDK (Arrow → pandas) and the internal node-to-
// node read forward. Shares the Data port (plain tonic, no Flight). Each chunk
// carries a slice of a single Arrow IPC stream (schema message first, then record
// batches); the client concatenates and decodes them. Reads only; uncapped.
service Stream {
  rpc ReadArrow(QueryRequest) returns (stream ArrowChunk);
}
message ArrowChunk {
  bytes ipc = 1;
  // The node that is actually executing this read, as `QueryMeta.served_by`
  // (its advertised internal endpoint). Set on the FIRST chunk — the one
  // carrying the schema message — and left empty on the rest, so a forwarding
  // node learns who served the read before the first batch arrives and relays
  // that name instead of its own.
  string served_by = 2;
  // The W3C `traceparent` of the span EXECUTING this read, as
  // `QueryMeta.traceparent`. Rides the first chunk beside `served_by`, for the
  // same reason and with the same rule: the two name the node that ran the
  // query, so a forwarding node relays both rather than substituting its own.
  // Without it a forwarded read is the one case with no span at all — the
  // greeter's meta never crosses this hop — which is exactly the pair a trace
  // viewer would want to nest. Empty from a node that predates the field.
  string traceparent = 3;
}
