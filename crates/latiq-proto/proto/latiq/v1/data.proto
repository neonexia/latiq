syntax = "proto3";
package latiq.v1;

// Data/Query surface — for the CLI and SDK (NOT agents; agents use MCP).
// Served by the pond node (it owns the engine + storage). Unary + bounded by
// the inline cap in M1; Arrow Flight SQL streaming for large results is M2.
// Identity is carried in gRPC metadata key `latiq-agent-id` (relaxed; default
// anonymous). Errors are returned as a tonic Status whose code maps from the
// ErrorKind and whose `details` carry the JSON-encoded ErrorEnvelope.
service Data {
  rpc AllocatePond(AllocatePondRequest) returns (AllocatePondResponse);
  rpc DropPond(DropPondRequest) returns (DropPondResponse);
  rpc DescribePond(DescribePondRequest) returns (JsonResponse);
  rpc ReadQuery(QueryRequest) returns (JsonResponse);
  rpc WriteQuery(QueryRequest) returns (JsonResponse);
  rpc ExplainQuery(QueryRequest) returns (JsonResponse);
  // Copy a dataset's tables into the pond (one CREATE TABLE each).
  rpc LoadDataset(LoadDatasetRequest) returns (JsonResponse);
  // Transient pull from an external catalog: attach (with creds) → run the query
  // (a CREATE TABLE … AS SELECT … FROM <catalog>.…) → detach. Nothing persists.
  rpc CatalogPull(CatalogPullRequest) returns (JsonResponse);
  // Transient attach → list the catalog's tables/columns → detach.
  rpc CatalogDescribe(CatalogDescribeRequest) returns (JsonResponse);
}

message LoadDatasetRequest { string pond = 1; string dataset = 2; }
// params carry runtime --set values (incl. credentials like `token`); merged
// over the catalog's persisted locator params (these win).
message CatalogPullRequest {
  string pond = 1; string catalog = 2; string query = 3;
  map<string, string> params = 4;
}
message CatalogDescribeRequest {
  string pond = 1; string catalog = 2; map<string, string> params = 3;
}

message AllocatePondRequest { string name = 1; string policy_json = 2; string tier = 3; }
message AllocatePondResponse { string pond_id = 1; string pond_name = 2; }
message DropPondRequest { string pond = 1; bool confirm = 2; }
message DropPondResponse { }
message DescribePondRequest { string pond = 1; }
message QueryRequest { string pond = 1; string sql = 2; }

// Carries a serialized JSON object: for queries `{columns, rows, statement,
// status, _meta}`; for describe `{pond, schema}`.
message JsonResponse { string json = 1; }

// Streaming Arrow read — for the SDK (Arrow → pandas) and the internal node-to-
// node read forward. Shares the Data port (plain tonic, no Flight). Each chunk
// carries a slice of a single Arrow IPC stream (schema message first, then record
// batches); the client concatenates and decodes them. Reads only; uncapped.
service Stream {
  rpc ReadArrow(QueryRequest) returns (stream ArrowChunk);
}
message ArrowChunk { bytes ipc = 1; }
