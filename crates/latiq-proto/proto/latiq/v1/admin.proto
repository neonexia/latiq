syntax = "proto3";
package latiq.v1;

import "latiq/v1/datasets.proto";

service Admin {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc DescribeNode(DescribeNodeRequest) returns (DescribeNodeResponse);
  rpc PolicyGet(PolicyGetRequest) returns (PolicyGetResponse);
  rpc PolicySet(PolicySetRequest) returns (PolicySetResponse);
  // Operators inspect ponds from the control plane (registry) directly, so this
  // works even when pond nodes are down (metadata read, not in the query path).
  rpc PondList(PondListRequest) returns (PondListResponse);
  // Re-tier a pond after creation (its memory/CPU caps). Registry-only: the
  // owning node resolves a pond's tier on every operation, so the new caps take
  // effect on that pond's next use, when its engine instance is re-opened.
  rpc PondSetTier(PondSetTierRequest) returns (PondSetTierResponse);
  // Operators curate the dataset catalog (add/remove); list/search is here too
  // so operators can browse it from the control plane.
  rpc DatasetAdd(DatasetAddRequest) returns (DatasetAddResponse);
  rpc DatasetRemove(DatasetRemoveRequest) returns (DatasetRemoveResponse);
  rpc DatasetList(DatasetListRequest) returns (DatasetListResponse);
  rpc CatalogAdd(CatalogAddRequest) returns (CatalogAddResponse);
  rpc CatalogRemove(CatalogRemoveRequest) returns (CatalogRemoveResponse);
  rpc CatalogList(CatalogListRequest) returns (CatalogListResponse);
}

message DatasetAddRequest { DatasetMsg dataset = 1; }
message DatasetAddResponse { string name = 1; }
message DatasetRemoveRequest { string name = 1; }
message DatasetRemoveResponse { }
// query: empty = all; "#tag" = by tag; "prefix*" = name glob; else a substring.
message DatasetListRequest { string query = 1; }
message DatasetListResponse { repeated DatasetMsg datasets = 1; }

message CatalogAddRequest { CatalogMsg catalog = 1; }
message CatalogAddResponse { string name = 1; repeated string dropped_params = 2; }
message CatalogRemoveRequest { string name = 1; }
message CatalogRemoveResponse { }
message CatalogListRequest { string query = 1; }
message CatalogListResponse { repeated CatalogMsg catalogs = 1; }

// `lineage` reports whether the pond records provenance; it is chosen at
// creation and fixed for the pond's lifetime (no admin RPC changes it).
message PondSummary { string pond_id = 1; string name = 2; string owner = 3; string created_at = 4; string node_id = 5; string tier = 6; string description = 7; bool lineage = 8; }
message PondListRequest { }
message PondListResponse { repeated PondSummary ponds = 1; }
// pond: name or id. tier: x-small|small|medium|large|x-large (rejected if unknown
// — we do NOT silently fall back to medium, which would resize the wrong way).
message PondSetTierRequest { string pond = 1; string tier = 2; }
message PondSetTierResponse { string pond = 1; string tier = 2; }

message NodeInfo {
  string node_id = 1; string mcp_endpoint = 2; string state = 3; uint32 pond_count = 4;
  string last_heartbeat = 5; uint64 heartbeat_age_seconds = 6;
}
message ListNodesRequest { }
message ListNodesResponse { repeated NodeInfo nodes = 1; }
message DescribeNodeRequest { string node_id = 1; }
message DescribeNodeResponse { NodeInfo node = 1; }
message PolicyGetRequest { }
message PolicyGetResponse { string policy_json = 1; }
message PolicySetRequest { string key = 1; string value = 2; }
message PolicySetResponse { }
