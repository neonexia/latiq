syntax = "proto3";
package latiq.v1;

import "latiq/v1/datasets.proto";

service Admin {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc DescribeNode(DescribeNodeRequest) returns (DescribeNodeResponse);
  rpc PolicyGet(PolicyGetRequest) returns (PolicyGetResponse);
  rpc PolicySet(PolicySetRequest) returns (PolicySetResponse);
  rpc AuditTail(AuditTailRequest) returns (AuditTailResponse);
  rpc AuditSearch(AuditSearchRequest) returns (AuditSearchResponse);
  // Operators inspect ponds from the control plane (registry) directly, so this
  // works even when pond nodes are down (metadata read, not in the query path).
  rpc PondList(PondListRequest) returns (PondListResponse);
  // Operators curate the dataset catalog (add/remove); list/search is here too
  // so operators can browse it from the control plane.
  rpc DatasetAdd(DatasetAddRequest) returns (DatasetAddResponse);
  rpc DatasetRemove(DatasetRemoveRequest) returns (DatasetRemoveResponse);
  rpc DatasetList(DatasetListRequest) returns (DatasetListResponse);
}

message DatasetAddRequest { DatasetMsg dataset = 1; }
message DatasetAddResponse { string ref = 1; }
message DatasetRemoveRequest { string ref = 1; }
message DatasetRemoveResponse { }
// query: empty = all; "#tag" = by tag; "prefix*" = namespace/ref glob; else a
// substring match over ref/name/description.
message DatasetListRequest { string query = 1; }
message DatasetListResponse { repeated DatasetMsg datasets = 1; }

message PondSummary { string pond_id = 1; string name = 2; string owner = 3; string created_at = 4; string node_id = 5; string tier = 6; }
message PondListRequest { }
message PondListResponse { repeated PondSummary ponds = 1; }

message NodeInfo {
  string node_id = 1; string mcp_endpoint = 2; string state = 3; uint32 pond_count = 4;
  string last_heartbeat = 5; uint64 heartbeat_age_seconds = 6;
}
message ListNodesRequest { }
message ListNodesResponse { repeated NodeInfo nodes = 1; }
message DescribeNodeRequest { string node_id = 1; }
message DescribeNodeResponse { NodeInfo node = 1; }
message PolicyGetRequest { }
message PolicyGetResponse { string policy_json = 1; }
message PolicySetRequest { string key = 1; string value = 2; }
message PolicySetResponse { }
message AuditEntry { string ts = 1; string agent_identity = 2; bool verified = 3; string operation = 4; string pond_id = 5; uint64 duration_ms = 6; }
message AuditTailRequest { uint32 limit = 1; }
message AuditTailResponse { repeated AuditEntry entries = 1; }
message AuditSearchRequest { string identity = 1; string since = 2; }
message AuditSearchResponse { repeated AuditEntry entries = 1; }
