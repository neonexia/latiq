[package]
name = "latiq-auth"
version.workspace = true
edition.workspace = true

[dependencies]
latiq-common = { path = "../latiq-common" }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# test-support only
axum = { workspace = true, optional = true }
rsa = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
# Ed25519 keygen for the fixture IdP. Already in the tree under `jsonwebtoken`,
# which is also what verifies the signatures -- so the fixture cannot drift from
# the verifier, and this adds nothing to the dependency graph.
ring = { version = "0.17", optional = true }
tokio-stream = { workspace = true, optional = true }

[features]
default = []
# An in-process fake IdP for tests. Off by default so none of this ships in a
# release binary; enabled by this crate's own tests and by other crates' tests.
test-support = ["dep:axum", "dep:rsa", "dep:rand", "dep:ring", "dep:tokio-stream"]

[dev-dependencies]
latiq-auth = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
