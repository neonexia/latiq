name: Nightly

# Heavy suite runs nightly (and on demand) — NOT per-PR — to stay within GitHub
# usage limits (see #28). Lint + unit + e2e, the iceberg/MinIO catalog e2e, and a
# real 3-node dockerized cluster scale-out test.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if nothing changed since the last publish (bypasses the change-gate). Still requires all tests to pass."
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Linking bundled DuckDB with full debug info OOMs the runner's linker
  # (ld ... signal 7 [Bus error]); CI doesn't debug from these binaries.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # The full verification suite lives in ONE place — `verify.yml` — because the
  # tagged-release path (`release.yml`) must run exactly the same checks (#55).
  # Everything the nightly used to run inline (fmt/clippy/test, iceberg, cluster
  # scale-out, the e2e suite, auth e2e) is in there, unchanged.
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml

  # ---- Versioned publish: only if (a) enabled, (b) something changed since the
  # last publish, and (c) every test/e2e job above is green. Inert until the repo
  # variable PUBLISH_NIGHTLY=true is set (after the one-time PyPI trusted-publisher
  # setup). Ships THREE artifacts on ONE version — the `latiq` wheel (PyPI), the
  # images (GHCR), and the `latiq-admin` operator CLI wheel (PyPI, in its own job
  # below). No Rust crates, no source (wheels are binaries). --------------------
  gate:
    name: publish gate (enabled? changed?)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      wheel_version: ${{ steps.decide.outputs.wheel_version }}
      # The version the BINARY reports. NOT `wheel_version`: the wheels are
      # stamped `<base>.dev<stamp>` for PyPI, but `latiq --version` comes from
      # clap via CARGO_PKG_VERSION and is the plain workspace version. Anything
      # asserting on the CLI's own output must compare against this.
      base_version: ${{ steps.decide.outputs.base_version }}
      image_stamp: ${{ steps.decide.outputs.image_stamp }}
      stamp: ${{ steps.decide.outputs.stamp }}
      # Newline-separated tag NAMES for both GHCR images, handed to `images.yml`.
      image_tags: ${{ steps.decide.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ vars.PUBLISH_NIGHTLY }}" != "true" ]; then
            echo "publishing disabled (set repo variable PUBLISH_NIGHTLY=true to enable)"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git tag -l 'nightly-*' --sort=-creatordate | head -1)
          if [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "force_publish requested — publishing regardless of changes"
          elif [ -n "$last" ] && [ "$(git rev-list "$last"..HEAD --count)" = "0" ]; then
            echo "no commits since $last — nothing to publish"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(grep -m1 -E '^version' sdk/python/pyproject.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          # What the compiled binary reports (`latiq --version`), read from the
          # workspace manifest rather than assumed equal to the wheel's base.
          cargo_base=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          stamp=$(date -u +%Y%m%d%H%M)
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "wheel_version=${base}.dev${stamp}" >> "$GITHUB_OUTPUT"
          echo "base_version=${cargo_base}" >> "$GITHUB_OUTPUT"
          echo "image_stamp=nightly-${stamp}" >> "$GITHUB_OUTPUT"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          # Both image tags as ONE multi-line output, so `images.yml` never has to
          # know the difference between a nightly stamp and a release version.
          {
            echo "image_tags<<TAGS_EOF"
            echo "nightly-${stamp}"
            echo "nightly"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: publish the wheel (PyPI), versioned
    needs: [gate, verify]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # PyPI trusted publishing (OIDC; no stored token)
    outputs:
      # 'true' only if this run actually uploaded to PyPI. The post-publish jobs
      # that install FROM PyPI read it; without it they would install an older
      # version and report it as this run's.
      uploaded: ${{ steps.pypi.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp the wheel version
        run: |
          sed -i.bak -E 's/^version = "[0-9.]+"/version = "${{ needs.gate.outputs.wheel_version }}"/' sdk/python/pyproject.toml
          rm -f sdk/python/pyproject.toml.bak
      # Build the manylinux wheel IN this job and publish from it — no cross-job
      # artifact handoff (the wheel statically links the whole server and is large;
      # artifacts blow the storage quota). Nightly ships the Linux/manylinux wheel
      # (the SDK's real consumers: servers, CI, Docker, Colab). macOS/other-platform
      # wheels are a tagged-release concern, not nightly.
      - uses: PyO3/maturin-action@v1
        env:
          # DuckDB's release (-O3) compile is memory-heavy; cap parallelism so it
          # doesn't OOM the runner inside the manylinux container.
          CARGO_BUILD_JOBS: "2"
        with:
          command: build
          target: x86_64
          # 2_28 = AlmaLinux 8 toolchain: modern GCC + the C++11 CXX ABI DuckDB
          # requires. The default (manylinux2014/CentOS 7) has the legacy ABI
          # (DuckDB refuses) AND a proto2-only protoc (can't parse our proto3).
          manylinux: "2_28"
          args: --release -m sdk/python/Cargo.toml -o dist
          before-script-linux: |
            # The container's distro protoc is too old (proto2-only) — install a
            # modern protoc binary so latiq-proto's proto3 compiles. `-f` makes curl
            # fail (non-zero) on an HTTP error instead of writing an error page to the
            # file (which then fails unzip with "end-of-central-directory not found");
            # retries ride out transient GitHub blips. Verify the zip before using it.
            set -e
            command -v unzip >/dev/null 2>&1 || dnf install -y unzip || yum install -y unzip
            # (--retry-all-errors is unavailable on the container's older curl.)
            curl -fsSL --retry 5 -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v27.2/protoc-27.2-linux-x86_64.zip
            unzip -t /tmp/protoc.zip >/dev/null
            unzip -o /tmp/protoc.zip -d /usr/local
            protoc --version
      # PyPI publishing is OFF unless the repo variable says so — the same switch
      # `release.yml` uses, and a deliberate policy choice while the deployment
      # is being stabilised. The wheel is still BUILT here, and `verify.yml`
      # already ran the full SDK e2e + auth suite against a wheel built from this
      # tree, so no wheel COVERAGE is lost; only the upload is withheld.
      - name: Is PyPI publishing enabled? (PUBLISH_PYPI_WHEELS)
        id: pypi
        env:
          V: ${{ needs.gate.outputs.wheel_version }}
          ENABLED: ${{ vars.PUBLISH_PYPI_WHEELS }}
        run: |
          set -eu
          if [ "${ENABLED:-}" = "true" ]; then
            echo "PUBLISH_PYPI_WHEELS=true — uploading latiq ${V} to PyPI"
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PUBLISH_PYPI_WHEELS is not 'true'; the latiq ${V} wheel was BUILT but NOT uploaded to PyPI"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: nightly PyPI wheel \`latiq\` **not** uploaded"
              echo
              echo "\`${V}\` was built but not uploaded: the repo variable \`PUBLISH_PYPI_WHEELS\`"
              echo "is not \`true\`. The GHCR images publish as normal, and the post-publish jobs"
              echo "that install **from PyPI** are skipped rather than testing an older version."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish the wheel to PyPI
        if: steps.pypi.outputs.uploaded == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Both GHCR images, as MULTI-ARCH manifest lists (linux/amd64 + linux/arm64 —
  # #66), from the SAME reusable workflow the tagged release calls. This used to
  # be four steps inside `publish` with no `platforms:` at all, which is how every
  # published image came out amd64-only. `images.yml` also asserts the published
  # manifests really carry both platforms, so this cannot go green having shipped
  # a single-arch image.
  images:
    name: publish the images (GHCR, multi-arch)
    needs: [gate, verify]
    if: needs.gate.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      tags: ${{ needs.gate.outputs.image_tags }}

  # The change-gate marker, in its own job so it lands only after BOTH the wheel
  # and the images are published. It used to be the last step of `publish`, which
  # was equivalent while one job did everything; now that the images are a
  # separate job, tagging from `publish` would mark the commit published while
  # the arm64 image was still building — and the next nightly would skip it.
  mark-published:
    name: mark this commit as published (nightly-<stamp> tag)
    needs: [gate, publish, images]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the nightly-<stamp> tag (the change-gate marker)
    steps:
      - uses: actions/checkout@v4
      - name: Tag it
        run: |
          set -eu
          git tag "nightly-${{ needs.gate.outputs.stamp }}"
          git push origin "nightly-${{ needs.gate.outputs.stamp }}"

  # Post-publish: prove `pip install latiq` actually works for an end user by
  # installing the JUST-PUBLISHED wheel FROM PyPI (not the local build) and running
  # the embedded suite against it — single-node in-process + Arrow→pandas.
  # Skipped when `publish` did not upload (PUBLISH_PYPI_WHEELS off): every step
  # here installs FROM PyPI, so there would be nothing at this version to install
  # — and a fallback to an older one would report it as this run's. `publish`'s
  # job summary says why.
  verify-published:
    name: verify pip install latiq (from PyPI, embedded)
    needs: [gate, publish]
    if: needs.gate.outputs.should_publish == 'true' && needs.publish.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip install latiq==<version> from PyPI (retry for propagation)
        run: |
          v="${{ needs.gate.outputs.wheel_version }}"
          for i in $(seq 1 12); do
            python -m pip install "latiq==${v}" && break
            echo "waiting for PyPI to serve ${v} (attempt $i)"; sleep 15
          done
          python -m pip install -r e2e/sdk/requirements.txt
      # The `latiq` console script the wheel now installs — `pip install latiq`
      # then `latiq serve`, the reason the CLI moved into the wheel at all. The
      # binary in the image is covered by the cluster e2e; NOTHING else covers
      # this entry point, and it can break in ways the Python API cannot (a
      # missing `[project.scripts]`, a PyO3 signature drift in `_cli_main`).
      #
      # Asserted on the artifact and the version string, not exit status: the
      # script must exist at the path pip generates, and must report the version
      # we published. `latiq serve` is then started for real and probed on its
      # port — a `--help` check would pass against a build that could not serve.
      - name: The wheel's `latiq` console script runs a server
        env:
          # The BINARY's version (clap/CARGO_PKG_VERSION), not the wheel's: the
          # nightly wheel is `<base>.dev<stamp>` on PyPI while the CLI it carries
          # reports the plain workspace version.
          V: ${{ needs.gate.outputs.base_version }}
        run: |
          set -eu
          bin=$(command -v latiq) || { echo "::error::the latiq wheel installed no \`latiq\` script"; exit 1; }
          echo "installed: $bin"
          got=$(latiq --version)
          [ "$got" = "latiq ${V}" ] || { echo "::error::\`latiq --version\` says '${got}', expected 'latiq ${V}'"; exit 1; }
          latiq serve --bind 127.0.0.1 --port 51466 --root "${RUNNER_TEMP}/cp" &
          serve_pid=$!
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/51466) 2>/dev/null && break
            sleep 1
          done
          # The proof is a CLIENT round-trip, not an open socket: `pond list`
          # exercises the Admin gRPC surface of the control plane this wheel just
          # started. Fails if `serve` died, never bound, or is a stub.
          out=$(LATIQ_SERVER=http://127.0.0.1:51466 latiq pond list) || {
            echo "::error::\`latiq pond list\` could not reach the control plane the wheel started"
            kill $serve_pid 2>/dev/null || true; exit 1; }
          echo "pond list: ${out}"
          kill $serve_pid
      # The wheel's OWN test suite (sdk/python/tests) — the Python API a user
      # calls, including the `lineage` allocation flag, which nothing else in CI
      # covers. It imports only `latiq` + pyarrow, so run from the repo root it
      # exercises the INSTALLED (published) wheel, not a source tree. pytest exits
      # 5 when it collects nothing, so a moved/renamed suite fails here.
      - name: The wheel's own test suite (against the published wheel)
        run: pytest sdk/python/tests -v
      # `--latiq-mode` makes the run assert what it was supposed to prove: without
      # it a suite where every test skipped would still exit 0 (see conftest.py).
      - name: Embedded smoke against the installed wheel
        run: pytest e2e/sdk -v --latiq-mode=embedded

  # Prove the REAL external-user path against the JUST-PUBLISHED artifacts — no
  # repo build. `deploy/docker-compose.yml` IS the file users curl (deploy/ is the
  # single source of truth for it), so we use the checked-out copy rather than
  # round-tripping it through raw.githubusercontent: same bytes, and the job
  # cannot silently go green against a stale published mirror. `docker compose up`
  # then pulls the published GHCR image and `pip install latiq` the PyPI wheel,
  # and the SDK + agent (MCP) suites run against the gatewayed cluster. Everything
  # UNDER TEST is a shipped artifact; only the compose and the test code are local.
  verify-deployment:
    name: verify user path (user compose + GHCR image + PyPI wheel)
    needs: [gate, publish, images]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for deploy/docker-compose.yml + e2e/ test code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The exact file a user curls from deploy/. Copied to the working dir so the
      # rest of the job's bare `docker compose` commands resolve it as a user's do.
      - name: Take the user compose
        run: cp deploy/docker-compose.yml docker-compose.yml
      # NOTE: no `docker login` — this tests the ANONYMOUS pull a real user makes.
      # Requires the GHCR `latiq` package to be PUBLIC (one-time org setting).
      - name: Bring up the cluster from the published images (pinned to this run)
        env:
          LATIQ_IMAGE: ghcr.io/${{ github.repository_owner }}/latiq:${{ needs.gate.outputs.image_stamp }}
          LATIQ_GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/latiq-gateway:${{ needs.gate.outputs.image_stamp }}
        run: docker compose up -d
      - name: Wait for control plane + nodes healthy
        run: |
          for _ in $(seq 1 60); do
            up=$(docker compose ps --format '{{.Health}}' | grep -c healthy || true)
            [ "$up" -ge 3 ] && break
            sleep 3
          done
          docker compose ps
      - name: Wait for the gateway ports to accept
        run: |
          for port in 51500 51510; do
            for _ in $(seq 1 30); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 1
            done
          done
      - name: npm ci for the agent harness
        run: npm ci --prefix e2e/agent
      # Gated for the same reason as `verify-published`: with the upload off,
      # `pip install latiq==<version>` has nothing to resolve — and, worse, a
      # loose resolve would test an older wheel and report it as this run's. The
      # image half of this job (the point of it) is unaffected and still runs.
      - name: pip install latiq==<version> from PyPI (retry for propagation)
        if: needs.publish.outputs.uploaded == 'true'
        run: |
          set -eu
          v="${{ needs.gate.outputs.wheel_version }}"
          for i in $(seq 1 12); do
            python -m pip install "latiq==${v}" && ok=1 && break
            echo "waiting for PyPI to serve ${v} (attempt $i)"; sleep 15
          done
          [ "${ok:-0}" = "1" ] || { echo "::error::latiq ${v} never installed from PyPI"; exit 1; }
          python -m pip install -r e2e/sdk/requirements.txt
      - name: SDK e2e against the deployed cluster (published wheel + image)
        if: needs.publish.outputs.uploaded == 'true'
        env:
          LATIQ_CONTROL: http://localhost:51400
          LATIQ_GATEWAY: http://localhost:51500
        # `remote` additionally REQUIRES the multi-node placement/forwarding test
        # to have run — the reason a cluster was started at all (see conftest.py).
        run: pytest e2e/sdk -v --latiq-mode=remote
      - name: Agent harness (MCP) against the deployed cluster
        env:
          LATIQ_MCP: http://localhost:51510/mcp
        run: npm --prefix e2e/agent test
      - name: Cluster logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The SAME user path on arm64 — the arch most developers evaluate on, and the
  # one nothing in CI had ever exercised (#66). `verify-deployment` above runs on
  # `ubuntu-latest`, so "verify user path" has only ever meant the amd64 half of
  # it; the published images were unpullable on Apple Silicon while this job was
  # green every night. The release path has the identical counterpart
  # (`verify-release-arm64`).
  #
  # NO `--platform`, NO `DOCKER_DEFAULT_PLATFORM`, NO emulation setup — what a
  # user typing `docker compose up -d` gets. No `pip install latiq` either: both
  # wheels build `target: x86_64` only, so there is no aarch64 wheel to install.
  # What this proves is the SERVER images running natively on arm64 with the
  # agent front door reachable through the gateway.
  verify-deployment-arm64:
    name: verify user path on arm64 (user compose + GHCR images)
    needs: [gate, images]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The literal command from the bug report, under the runtime that produced
      # it. Podman resolves OCI manifest lists itself, so this is the check that
      # `podman compose up` on an Apple Silicon Mac gets past the pull — where
      # #66 actually failed, before any of our code ran. (Full `podman compose`
      # orchestration is not exercised in CI.)
      - name: podman can pull both images on arm64 (the #66 reproduction)
        env:
          T: ${{ needs.gate.outputs.image_stamp }}
          V: ${{ needs.gate.outputs.base_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          command -v podman >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version
          for img in latiq latiq-gateway; do
            ref="ghcr.io/${OWNER}/${img}:${T}"
            echo "::group::podman pull ${ref}"
            # No --platform: the whole point is that default resolution works.
            podman pull "$ref"
            echo "::endgroup::"
          done
          # And the arm64 binary actually starts. A manifest that resolved to an
          # amd64 image would get an exec-format error here, not a silent pass.
          # The BINARY reports the plain workspace version, not the wheel stamp.
          got=$(podman run --rm "ghcr.io/${OWNER}/latiq:${T}" --version)
          echo "podman run latiq --version -> ${got}"
          [ "$got" = "latiq ${V}" ] || { echo "::error::expected 'latiq ${V}', got '${got}'"; exit 1; }
      - name: Take the user compose
        run: cp deploy/docker-compose.yml docker-compose.yml
      # NOTE: no `docker login` — this tests the ANONYMOUS pull a real user makes.
      - name: Bring up the cluster from the published images (no platform override)
        env:
          LATIQ_IMAGE: ghcr.io/${{ github.repository_owner }}/latiq:${{ needs.gate.outputs.image_stamp }}
          LATIQ_GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/latiq-gateway:${{ needs.gate.outputs.image_stamp }}
        run: docker compose up -d
      # Proof it is NATIVE, not emulated: with binfmt registered, an amd64-only
      # manifest can still run under qemu-user and pass every check below — which
      # would make this whole job green against exactly the state we are fixing.
      - name: The running containers are really arm64
        run: |
          set -eu
          for svc in control-plane pond-node-1 gateway; do
            cid=$(docker compose ps -q "$svc")
            [ -n "$cid" ] || { echo "::error::service ${svc} has no container"; exit 1; }
            img=$(docker inspect -f '{{.Image}}' "$cid")
            arch=$(docker image inspect -f '{{.Architecture}}' "$img")
            echo "${svc}: ${arch}"
            [ "$arch" = "arm64" ] || { echo "::error::${svc} is running a ${arch} image on an arm64 host"; exit 1; }
          done
      - name: Wait for control plane + nodes healthy
        run: |
          set -eu
          for _ in $(seq 1 60); do
            up=$(docker compose ps --format '{{.Health}}' | grep -c healthy || true)
            [ "$up" -ge 3 ] && break
            sleep 3
          done
          docker compose ps
          # Here the wait IS the assertion: "the images start on this arch" is
          # the thing under test, so falling through would prove nothing.
          up=$(docker compose ps --format '{{.Health}}' | grep -c healthy || true)
          [ "$up" -ge 3 ] || { echo "::error::only ${up} services healthy after 3 minutes"; exit 1; }
      - name: Wait for the gateway ports to accept
        run: |
          for port in 51500 51510; do
            for _ in $(seq 1 30); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 1
            done
          done
      # The CLI inside the image — the arm64 binary driving Admin gRPC against
      # the arm64 control plane. Needs no wheel, so it works on this arch today.
      - name: The image's own CLI reaches the control plane
        run: |
          set -eu
          out=$(docker compose exec -T pond-node-1 latiq pond list)
          echo "pond list: ${out}"
      - name: npm ci for the agent harness
        run: npm ci --prefix e2e/agent
      # The real end-to-end: allocate, write, read, drop over MCP through the
      # gateway, against arm64 images. That is what "docker compose up works on
      # Apple Silicon" has to mean to be worth asserting.
      - name: Agent harness (MCP) against the arm64 cluster
        env:
          LATIQ_MCP: http://localhost:51510/mcp
        run: npm --prefix e2e/agent test
      - name: Cluster logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The lean operator CLI, as a SECOND wheel (`latiq-admin`) rather than the four
  # cross-compiled binaries + `curl | sh` installer this replaces. Same Rust build
  # (`-p latiq --no-default-features`), delivered by pip: maturin's `bin` bindings
  # put the native executable in the wheel's scripts dir, so `pipx install
  # latiq-admin` puts `latiq` on PATH with none of a shell installer's problems
  # (no unsigned pipe to sh, no hand-rolled platform detection, no rolling asset
  # bucket to keep in sync with the installer, and an uninstall that works).
  #
  # A SEPARATE JOB from `publish`, deliberately: `latiq-admin` is a distinct PyPI
  # project and needs its OWN trusted-publisher entry (docs/releasing.md). Until
  # that exists this job cannot succeed, and putting it in `publish` would mean a
  # missing publisher for the NEW wheel blocked the WORKING one — the `latiq`
  # wheel and both images are already pushed by the time this starts.
  #
  # `PUBLISH_ADMIN_WHEEL` is the same shape of switch as `PUBLISH_NIGHTLY`: off
  # until the one-time PyPI setup is done, and then required to pass. Off, the job
  # SKIPS (visibly, in the run's job list) rather than reporting a green publish it
  # did not do; on, nothing here tolerates a failure.
  publish-admin:
    name: publish latiq-admin (PyPI)
    needs: [gate, publish]
    if: needs.gate.outputs.should_publish == 'true' && vars.PUBLISH_ADMIN_WHEEL == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # PyPI trusted publishing (OIDC; no stored token)
    outputs:
      uploaded: ${{ steps.pypi.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4
      # The same version as the `latiq` wheel and the image from this run: the two
      # wheels are one CLI built two ways, so a user comparing them must not have
      # to work out which pair of versions goes together.
      - name: Stamp the admin wheel version
        run: |
          sed -i.bak -E 's/^version = "[0-9.]+"/version = "${{ needs.gate.outputs.wheel_version }}"/' sdk/admin/pyproject.toml
          rm -f sdk/admin/pyproject.toml.bak
          grep -E '^version = ' sdk/admin/pyproject.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          # Matching `publish`'s container, for the modern protoc below rather
          # than for DuckDB's C++ ABI — this build has no DuckDB at all, which is
          # why it needs no CARGO_BUILD_JOBS cap and takes a fraction of the time.
          manylinux: "2_28"
          # No `-m`: `bindings`/`no-default-features` come from the pyproject.toml
          # in this directory, so the wheel cannot be built with the server
          # features that the file exists to exclude.
          working-directory: sdk/admin
          args: --release -o dist
          before-script-linux: |
            set -e
            command -v unzip >/dev/null 2>&1 || dnf install -y unzip || yum install -y unzip
            curl -fsSL --retry 5 -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v27.2/protoc-27.2-linux-x86_64.zip
            unzip -t /tmp/protoc.zip >/dev/null
            unzip -o /tmp/protoc.zip -d /usr/local
            protoc --version
      # Same switch as the `latiq` wheel; only the upload is gated, the build
      # (and so the lean-build compile) still happens every night.
      - name: Is PyPI publishing enabled? (PUBLISH_PYPI_WHEELS)
        id: pypi
        env:
          V: ${{ needs.gate.outputs.wheel_version }}
          ENABLED: ${{ vars.PUBLISH_PYPI_WHEELS }}
        run: |
          set -eu
          if [ "${ENABLED:-}" = "true" ]; then
            echo "PUBLISH_PYPI_WHEELS=true — uploading latiq-admin ${V} to PyPI"
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PUBLISH_PYPI_WHEELS is not 'true'; the latiq-admin ${V} wheel was BUILT but NOT uploaded to PyPI"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: nightly PyPI wheel \`latiq-admin\` **not** uploaded"
              echo
              echo "\`${V}\` was built but not uploaded (\`PUBLISH_PYPI_WHEELS\` is not \`true\`);"
              echo "\`verify-admin-cli\`, which installs it from PyPI, is skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish latiq-admin to PyPI
        if: steps.pypi.outputs.uploaded == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/admin/dist

  # Post-publish proof for the channel that REPLACED the installer, mirroring what
  # `verify-published` does for the `latiq` wheel: install `latiq-admin` FROM PyPI
  # and drive the binary it put on PATH.
  #
  # Every assertion here is on an ARTIFACT or a STRING, never on an exit status:
  # `pip install` is checked by resolving `latiq` on PATH and matching the exact
  # version we just published, and the lean build is proved by the refusal text
  # `latiq serve` prints — a full build would start a control plane instead. A
  # check that only ran `latiq --help` would pass against any `latiq` that
  # happened to be on the runner.
  verify-admin-cli:
    name: verify pipx install latiq-admin (from PyPI)
    needs: [gate, publish-admin]
    # Also requires the upload to have happened: every assertion below drives a
    # binary installed FROM PyPI (`publish-admin`'s summary says so when it did not).
    if: needs.gate.outputs.should_publish == 'true' && vars.PUBLISH_ADMIN_WHEEL == 'true' && needs.publish-admin.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip install latiq-admin==<version> from PyPI (retry for propagation)
        env:
          V: ${{ needs.gate.outputs.wheel_version }}
        run: |
          set -eu
          for i in $(seq 1 12); do
            python -m pip install "latiq-admin==${V}" && ok=1 && break
            echo "waiting for PyPI to serve latiq-admin ${V} (attempt $i)"; sleep 15
          done
          # Without this the loop falls through to a green step after 12 failures,
          # and every assertion below would then run against a `latiq` that was
          # never installed (or not run at all).
          [ "${ok:-0}" = "1" ] || { echo "::error::latiq-admin ${V} never installed from PyPI"; exit 1; }
      - name: The wheel really put a `latiq` on PATH, at the version we published
        env:
          # As above: the binary reports the workspace version, while the wheel
          # it shipped in is `<base>.dev<stamp>`.
          V: ${{ needs.gate.outputs.base_version }}
        run: |
          set -eu
          bin=$(command -v latiq) || { echo "::error::no \`latiq\` on PATH after installing latiq-admin"; exit 1; }
          echo "installed: $bin"
          # A native executable, not a Python shim: `bindings = "bin"` ships the
          # compiled binary itself, and if that ever silently became a script the
          # wheel would no longer be the thing this channel promises.
          file "$bin"
          got=$(latiq --version)
          [ "$got" = "latiq ${V}" ] || { echo "::error::\`latiq --version\` says '${got}', expected 'latiq ${V}'"; exit 1; }
      - name: It is the LEAN build — a server role refuses and names the fix
        run: |
          set -eu
          # `latiq serve` must FAIL here. In the full build it would bind a port
          # and never return, so `set -o pipefail` + an inverted status is the
          # assertion: a green step means the client-only build refused.
          if out=$(latiq serve --bind 127.0.0.1 --port 51400 2>&1); then
            echo "::error::\`latiq serve\` succeeded in latiq-admin — this wheel is not the client-only build"
            exit 1
          fi
          echo "$out"
          # The refusal has to be OURS (crates/latiq/src/lib.rs::server_role_unavailable),
          # not clap's "unrecognized subcommand" and not a bind error, and it has to
          # name the install that can serve.
          echo "$out" | grep -q 'needs the full build' \
            || { echo "::error::not the packaging refusal we ship"; exit 1; }
          echo "$out" | grep -q 'pip install latiq' \
            || { echo "::error::the refusal must name the install that CAN serve"; exit 1; }
      - name: A client command reaches the network (not a stub build)
        run: |
          set -eu
          # No control plane here, so this must fail — but with the CONNECTION
          # error, which only a build that really dialled gRPC can produce.
          if out=$(latiq pond list 2>&1); then
            echo "::error::\`latiq pond list\` succeeded with no control plane running"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'could not reach the control plane' \
            || { echo "::error::expected the control-plane connection error; got: ${out}"; exit 1; }
