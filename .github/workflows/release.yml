name: Release

# A DELIBERATE, versioned release: push a `v<major>.<minor>.<patch>` tag.
#
# This replaces `release-images.yml`, which published the GHCR image on any `v*`
# tag with NO test step at all (#55) — a tagged release could ship code that had
# never been built, let alone tested. Here every publishing job `needs: verify`,
# and `verify` is the SAME reusable workflow the nightly runs (`verify.yml`):
# fmt + clippy + the full workspace test suite, the iceberg/MinIO catalog e2e,
# the dockerized cluster scale-out, the `e2e/` suite (SDK + MCP agent + perf)
# against a gatewayed 3-node cluster, and the authenticated-cluster e2e.
#
# Nothing here can publish an artifact whose tests did not pass: there is no
# `continue-on-error`, no `if: always()`, and no publishing job that omits
# `verify` from its `needs`.
#
# `workflow_dispatch` is the manual escape hatch — re-run a release after a
# transient CI failure by selecting the SAME `v*` tag in the ref picker. It is
# idempotent: an existing GitHub release is reused, `gh release upload` uses
# `--clobber`, and the image/wheel builds overwrite by tag. (PyPI is the one
# exception — it refuses to re-upload an existing version; see docs/releasing.md.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Linking bundled DuckDB with full debug info OOMs the runner's linker
  # (ld ... signal 7 [Bus error]); CI doesn't debug from these binaries.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Cheap and first: refuse a malformed tag, and refuse a tag whose version does
  # not match the version in the tree. One version, five places it shows up (git
  # tag, both wheels, image, release) — if they can drift, they will.
  meta:
    name: resolve + check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *)
              echo "::error::Release runs on a v<major>.<minor>.<patch> tag; got '${REF}'."
              echo "::error::On a manual run, pick the tag (not a branch) in the ref selector."
              exit 1 ;;
          esac
          version="${REF#v}"

          # Each wheel's version comes from its own pyproject.toml (maturin reads
          # it) and the binary's from the workspace Cargo.toml. All must already
          # equal the tag — we do NOT rewrite them here, because a released
          # artifact should be buildable from the tagged tree byte-for-byte.
          #
          # `sdk/admin/pyproject.toml` is checked for exactly the reason the other
          # two are: it is a third place the version can drift, and an unchecked
          # one is how a tagged release ships `latiq-admin` at a version that is
          # not the tag.
          rs=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fail=0
          for f in sdk/python/pyproject.toml sdk/admin/pyproject.toml; do
            got=$(grep -m1 -E '^version = ' "$f" | sed -E 's/.*"([^"]+)".*/\1/')
            if [ "$got" != "$version" ]; then
              echo "::error file=${f}::version is '${got}' but the tag says '${version}'"
              fail=1
            fi
          done
          if [ "$rs" != "$version" ]; then
            echo "::error file=Cargo.toml::[workspace.package] version is '${rs}' but the tag says '${version}'"
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::Bump the versions, commit, and re-tag. See docs/releasing.md."
            exit 1
          fi

          # 0.x is pre-1.0: mark the GitHub release a prerelease and DON'T move the
          # `latest` image tag. `latest` starts meaning something at 1.0.0.
          case "$version" in
            0.*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "releasing ${version} (prerelease=${prerelease})"

  # THE GATE. Identical to what the nightly runs — see verify.yml.
  verify:
    name: verify
    needs: meta
    uses: ./.github/workflows/verify.yml

  # The GitHub release itself, created first so the two wheel jobs have somewhere
  # to attach their assets.
  release:
    name: GitHub release (generated notes)
    needs: [meta, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --generate-notes diffs against the previous tag
      - name: Create (or reuse) the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release ${TAG} already exists — reusing it"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --generate-notes --prerelease
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --generate-notes --latest
          fi

  # The manylinux x86_64 wheel → PyPI, built the same way the nightly builds it.
  # Trusted publishing (OIDC), so there is no PyPI token anywhere; PyPI matches on
  # the WORKFLOW FILENAME, so `release.yml` needs its own trusted-publisher entry
  # alongside `nightly.yml`'s (docs/releasing.md). No version stamping — `meta`
  # already proved pyproject.toml carries the tag's version.
  wheel:
    name: publish the wheel (PyPI + release asset)
    needs: [meta, verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the wheel to the release
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        env:
          # DuckDB's release (-O3) compile is memory-heavy; cap parallelism so it
          # doesn't OOM the runner inside the manylinux container.
          CARGO_BUILD_JOBS: "2"
        with:
          command: build
          target: x86_64
          # 2_28 = AlmaLinux 8 toolchain: modern GCC + the C++11 CXX ABI DuckDB
          # requires. The default (manylinux2014/CentOS 7) has the legacy ABI
          # (DuckDB refuses) AND a proto2-only protoc (can't parse our proto3).
          manylinux: "2_28"
          args: --release -m sdk/python/Cargo.toml -o dist
          before-script-linux: |
            # The container's distro protoc is too old (proto2-only) — install a
            # modern protoc binary so latiq-proto's proto3 compiles. `-f` makes curl
            # fail (non-zero) on an HTTP error instead of writing an error page to the
            # file (which then fails unzip with "end-of-central-directory not found");
            # retries ride out transient GitHub blips. Verify the zip before using it.
            set -e
            command -v unzip >/dev/null 2>&1 || dnf install -y unzip || yum install -y unzip
            # (--retry-all-errors is unavailable on the container's older curl.)
            curl -fsSL --retry 5 -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v27.2/protoc-27.2-linux-x86_64.zip
            unzip -t /tmp/protoc.zip >/dev/null
            unzip -o /tmp/protoc.zip -d /usr/local
            protoc --version
      - name: Publish the wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Attach the wheel to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" --repo "$REPO" --clobber dist/*.whl

  # Both GHCR images, tagged with the version. `latest` moves ONLY for a >=1.0.0
  # release — a 0.x prerelease must not become what an unpinned `docker pull`
  # gets. (`nightly.yml` owns the separate rolling `:nightly` tag.)
  images:
    name: publish the images (GHCR)
    needs: [meta, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The container driver is required for `cache-to: type=gha` (the default
      # docker driver can't export the cache).
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: imgmeta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/latiq
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
      - name: Build + push the latiq image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.imgmeta.outputs.tags }}
          labels: ${{ steps.imgmeta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The gateway image (nginx + baked front-door config) — so the user compose
      # stays pure images on a tagged release too. Same tags, same rules.
      - name: Gateway image metadata
        id: gwmeta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/latiq-gateway
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
      - name: Build + push the gateway image
        uses: docker/build-push-action@v6
        with:
          context: deploy/cluster
          file: deploy/gateway.Dockerfile
          push: true
          tags: ${{ steps.gwmeta.outputs.tags }}
          labels: ${{ steps.gwmeta.outputs.labels }}

  # The lean operator CLI as a second wheel (`latiq-admin`) — what replaced the
  # four cross-compiled binaries, the rolling `cli-latest` asset bucket, and the
  # `curl | sh` installer. Same Rust build (`-p latiq --no-default-features`),
  # delivered by pip: maturin's `bin` bindings put the native executable in the
  # wheel's scripts dir, so `pipx install latiq-admin` puts `latiq` on PATH.
  #
  # A SEPARATE JOB from `wheel`, deliberately: `latiq-admin` is its own PyPI
  # project needing its own trusted-publisher entry, and PyPI matches on the
  # WORKFLOW FILENAME — so it needs one for `release.yml` as well as one for
  # `nightly.yml` (docs/releasing.md). Splitting it keeps a missing publisher for
  # the NEW wheel from blocking the WORKING one: `wheel` has already uploaded
  # `latiq` and attached it to the release before this job starts.
  #
  # `PUBLISH_ADMIN_WHEEL` is the same switch the nightly uses — off until the
  # one-time PyPI setup is done (the job then SKIPS, visibly, rather than
  # reporting a publish it did not do), and required to pass once it is on. No
  # version stamping: `meta` already proved sdk/admin/pyproject.toml carries the
  # tag's version.
  wheel-admin:
    name: publish latiq-admin (PyPI + release asset)
    needs: [meta, verify, release]
    if: vars.PUBLISH_ADMIN_WHEEL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the wheel to the release
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          # Matching the `wheel` job's container for the modern protoc below, not
          # for DuckDB's C++ ABI — this build has no DuckDB at all, which is why
          # it needs no CARGO_BUILD_JOBS cap and takes a fraction of the time.
          manylinux: "2_28"
          # No `-m`: `bindings`/`no-default-features` come from the pyproject.toml
          # in this directory, so the wheel cannot be built with the server
          # features that the file exists to exclude.
          working-directory: sdk/admin
          args: --release -o dist
          before-script-linux: |
            set -e
            command -v unzip >/dev/null 2>&1 || dnf install -y unzip || yum install -y unzip
            curl -fsSL --retry 5 -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v27.2/protoc-27.2-linux-x86_64.zip
            unzip -t /tmp/protoc.zip >/dev/null
            unzip -o /tmp/protoc.zip -d /usr/local
            protoc --version
      - name: Publish latiq-admin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/admin/dist
      - name: Attach the admin wheel to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" --repo "$REPO" --clobber sdk/admin/dist/*.whl

  # The same proof `verify-admin-cli` gives the nightly, against the tagged
  # release's wheel: install `latiq-admin` FROM PyPI and drive the binary it put
  # on PATH. Every assertion is on an ARTIFACT or a STRING, never an exit status.
  verify-admin-cli:
    name: verify pipx install latiq-admin (from PyPI)
    needs: [meta, wheel-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip install latiq-admin==<version> from PyPI (retry for propagation)
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          for i in $(seq 1 12); do
            python -m pip install "latiq-admin==${V}" && ok=1 && break
            echo "waiting for PyPI to serve latiq-admin ${V} (attempt $i)"; sleep 15
          done
          # Without this the loop falls through to a green step after 12 failures,
          # and every assertion below would then run against a `latiq` that was
          # never installed (or not run at all).
          [ "${ok:-0}" = "1" ] || { echo "::error::latiq-admin ${V} never installed from PyPI"; exit 1; }
      - name: The wheel really put a `latiq` on PATH, at the released version
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          bin=$(command -v latiq) || { echo "::error::no \`latiq\` on PATH after installing latiq-admin"; exit 1; }
          echo "installed: $bin"
          file "$bin"
          got=$(latiq --version)
          [ "$got" = "latiq ${V}" ] || { echo "::error::\`latiq --version\` says '${got}', expected 'latiq ${V}'"; exit 1; }
      - name: It is the LEAN build — a server role refuses and names the fix
        run: |
          set -eu
          if out=$(latiq serve --bind 127.0.0.1 --port 51400 2>&1); then
            echo "::error::\`latiq serve\` succeeded in latiq-admin — this wheel is not the client-only build"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'needs the full build' \
            || { echo "::error::not the packaging refusal we ship"; exit 1; }
          echo "$out" | grep -q 'pip install latiq' \
            || { echo "::error::the refusal must name the install that CAN serve"; exit 1; }
      - name: A client command reaches the network (not a stub build)
        run: |
          set -eu
          if out=$(latiq pond list 2>&1); then
            echo "::error::\`latiq pond list\` succeeded with no control plane running"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'could not reach the control plane' \
            || { echo "::error::expected the control-plane connection error; got: ${out}"; exit 1; }

  # Post-publish proof that the SHIPPED artifacts work for an external user: the
  # published compose pulls the JUST-PUSHED GHCR images, `pip install latiq==<v>`
  # takes the JUST-PUBLISHED wheel from PyPI, and the SDK + MCP agent suites run
  # against that. Nothing under test is built from the working tree. Mirrors the
  # nightly's `verify-deployment`.
  verify-release:
    name: verify user path (user compose + GHCR image + PyPI wheel)
    needs: [meta, wheel, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for deploy/docker-compose.yml + e2e/ test code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Take the user compose
        run: cp deploy/docker-compose.yml docker-compose.yml
      # NOTE: no `docker login` — this tests the ANONYMOUS pull a real user makes.
      # Requires both GHCR packages to be PUBLIC (one-time org setting).
      - name: Bring up the cluster from the published images (pinned to this release)
        env:
          LATIQ_IMAGE: ghcr.io/${{ github.repository_owner }}/latiq:${{ needs.meta.outputs.version }}
          LATIQ_GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/latiq-gateway:${{ needs.meta.outputs.version }}
        run: docker compose up -d
      - name: Wait for control plane + nodes healthy
        run: |
          for _ in $(seq 1 60); do
            up=$(docker compose ps --format '{{.Health}}' | grep -c healthy || true)
            [ "$up" -ge 3 ] && break
            sleep 3
          done
          docker compose ps
      - name: Wait for the gateway ports to accept
        run: |
          for port in 51500 51510; do
            for _ in $(seq 1 30); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 1
            done
          done
      - name: pip install latiq==<version> from PyPI (retry for propagation)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for i in $(seq 1 12); do
            python -m pip install "latiq==${VERSION}" && break
            echo "waiting for PyPI to serve ${VERSION} (attempt $i)"; sleep 15
          done
          python -m pip install -r e2e/sdk/requirements.txt
          npm ci --prefix e2e/agent
      # The `latiq` console script the wheel now installs — `pip install latiq`
      # then `latiq serve`, the reason the CLI moved into the wheel at all. The
      # release counterpart of the nightly's identical check; asserted on the
      # artifact and the version string, and then on a real client round-trip
      # against a server this wheel started (a `--help` check would pass against
      # a build that could not serve). Its own port, so the compose cluster
      # already up in this job is untouched.
      - name: The wheel's `latiq` console script runs a server
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          bin=$(command -v latiq) || { echo "::error::the latiq wheel installed no \`latiq\` script"; exit 1; }
          echo "installed: $bin"
          got=$(latiq --version)
          [ "$got" = "latiq ${V}" ] || { echo "::error::\`latiq --version\` says '${got}', expected 'latiq ${V}'"; exit 1; }
          latiq serve --bind 127.0.0.1 --port 51466 --root "${RUNNER_TEMP}/cp" &
          serve_pid=$!
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/51466) 2>/dev/null && break
            sleep 1
          done
          out=$(LATIQ_SERVER=http://127.0.0.1:51466 latiq pond list) || {
            echo "::error::\`latiq pond list\` could not reach the control plane the wheel started"
            kill $serve_pid 2>/dev/null || true; exit 1; }
          echo "pond list: ${out}"
          kill $serve_pid
      # The wheel's OWN test suite (sdk/python/tests) — the Python API a user
      # calls, including the `lineage` allocation flag, which nothing else in CI
      # covers. It imports only `latiq` + pyarrow and drives `connect("local")`,
      # so it needs no cluster and runs against the INSTALLED (published) wheel.
      # This is the release counterpart of the nightly's embedded verification.
      # pytest exits 5 when it collects nothing, so a moved suite fails here.
      - name: The wheel's own test suite (embedded, against the published wheel)
        run: pytest sdk/python/tests -v
      - name: SDK e2e against the released cluster
        env:
          LATIQ_CONTROL: http://localhost:51400
          LATIQ_GATEWAY: http://localhost:51500
        # `remote` additionally REQUIRES the multi-node placement/forwarding test
        # to have run — without it a green run proves nothing (see conftest.py).
        run: pytest e2e/sdk -v --latiq-mode=remote
      - name: Agent harness (MCP) against the released cluster
        env:
          LATIQ_MCP: http://localhost:51510/mcp
        run: npm --prefix e2e/agent test
      - name: Cluster logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
