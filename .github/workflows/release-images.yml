name: Release images

# Publish the single-binary Latiq image to GHCR for a DELIBERATE release: a `v*`
# version tag, or a manual run. Rolling (test-gated, change-gated) nightly images
# are published by `nightly.yml`'s publish job instead — so main pushes no longer
# ship an UNtested `latest` image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/latiq

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The gateway image (nginx + baked front-door config), same tags, so the
      # user compose stays pure-images on a tagged release too.
      - name: Gateway image metadata
        id: gwmeta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/latiq-gateway
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push the gateway image
        uses: docker/build-push-action@v6
        with:
          context: deploy/cluster
          file: deploy/gateway.Dockerfile
          push: true
          tags: ${{ steps.gwmeta.outputs.tags }}
          labels: ${{ steps.gwmeta.outputs.labels }}
