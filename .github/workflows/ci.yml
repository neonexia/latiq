name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Linking the bundled DuckDB static lib with full debug info exhausts the
  # GitHub runner's linker memory (`ld ... signal 7 [Bus error]`). Drop debug
  # info in CI — we don't debug from CI binaries. (See #28: heavy builds move
  # to a nightly dockerized suite; PR CI stays lean.)
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The first build compiles DuckDB from source (slow); cache it.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The full suite, including the deterministic datasets + DuckLake-catalog
      # e2e tests (tests/catalogs.rs). The iceberg/MinIO variant is #[ignore]d
      # (needs docker) and runs in the separate `iceberg` job below.
      - name: Test
        run: cargo test --workspace

  iceberg:
    name: iceberg + minio e2e (docker)
    runs-on: ubuntu-latest
    # Opt-in: heavy (spins MinIO + an Iceberg REST catalog). Run on demand or for
    # changes that touch the catalog attachers.
    if: contains(github.event.head_commit.message, '[iceberg-ci]') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bring up MinIO + Iceberg REST + seed a table
        run: ./deploy/iceberg-minio/up.sh
      - name: Run the ignored iceberg e2e
        env:
          # Base REST URL — DuckDB's iceberg client appends /v1/config etc. itself.
          LATIQ_ICEBERG_ENDPOINT: http://localhost:8181
          LATIQ_ICEBERG_WAREHOUSE: demo
          LATIQ_ICEBERG_TOKEN: dummy
          LATIQ_S3_ENDPOINT: http://localhost:9000
          LATIQ_S3_ACCESS_KEY: admin
          LATIQ_S3_SECRET_KEY: password
        run: cargo test -p latiq --test catalogs_iceberg -- --ignored --nocapture
