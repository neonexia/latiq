# Latiq query gateway — the single front door clients hit (SDK + agents), exactly
# like an nginx/LB in front of pond nodes in k8s. It spreads requests across the
# pond nodes; whichever node receives a request is the "greeter" and forwards to
# the pond's owner internally (so a pond owned by a node NOT in this pool — e.g.
# pond-node-3 — is still reachable, which is the whole point of forwarding).
#
#   :51500  gRPC  → Data + Stream (CLI/SDK: allocate/read/write/ReadArrow)
#   :51510  HTTP  → MCP (agents, streamable HTTP)
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's embedded DNS, so upstream hostnames resolve on the compose network.
  resolver 127.0.0.11 valid=10s;

  # --- Data + Stream gRPC front door (HTTP/2) ---------------------------------
  upstream latiq_data {
    server pond-node-1:51401;
    server pond-node-2:51401;
  }
  server {
    listen 51500;
    http2 on;
    # Long-lived server streams (ReadArrow) must not be cut off mid-result.
    grpc_read_timeout  3600s;
    grpc_send_timeout  3600s;
    location / {
      grpc_pass grpc://latiq_data;
    }
  }

  # --- MCP HTTP front door (agents; streamable HTTP / SSE) ---------------------
  # MCP sessions are node-local (rmcp's in-memory session manager): the client
  # `initialize`s, gets an Mcp-Session-Id, and every later request must reach the
  # SAME node or it's "session not found". So the front door must be sticky —
  # `ip_hash` pins each client to one node. Cross-node pond ops still work: that
  # node's AgentOps forwards to the pond's owner. (Data/Stream below stays
  # round-robin — it's stateless and forwards by pond.)
  upstream latiq_mcp {
    ip_hash;
    server pond-node-1:51402;
    server pond-node-2:51402;
  }
  server {
    listen 51510;
    location / {
      proxy_pass http://latiq_mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      # SSE/streamed tool responses: don't buffer, don't time out the stream.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding on;
    }
  }
}
