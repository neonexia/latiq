# Full Latiq cluster: a control plane + 3 pond nodes, with Prometheus scraping
# every node and a local MinIO + Iceberg REST catalog for the catalog e2e.
#
# pond-node-3 sits behind the `scale` profile so a default `up` starts a 2-node
# cluster; the scale-out test adds the 3rd at runtime (see scale_out_test.sh).
#
# Every node binds 0.0.0.0 inside its own container and advertises its compose
# hostname (pond-node-N:51401) so the control plane stores a routable endpoint and
# the CLI/forwarding can reach the owning node. Image is overridable so CI pins a
# published GHCR tag and local dev builds from source:
#   LATIQ_IMAGE=ghcr.io/neonexia/latiq:dev docker compose -f deploy/cluster/docker-compose.yml up
x-latiq: &latiq
  image: ${LATIQ_IMAGE:-ghcr.io/neonexia/latiq:dev}
  restart: unless-stopped

services:
  control-plane:
    <<: *latiq
    hostname: control-plane
    command: ["serve", "--bind", "0.0.0.0", "--port", "51400", "--root", "/var/lib/latiq"]
    ports: ["51400:51400"]   # Control + Admin gRPC (CLI/operators)
    environment:
      # Blank unless auth mode. Set by auth.env; a blank issuer = auth off.
      LATIQ_AUTH_ISSUER: ${LATIQ_AUTH_ISSUER:-}
      LATIQ_AUTH_AUDIENCE: ${LATIQ_AUTH_AUDIENCE:-latiq}
      # TEST-ONLY. Keycloak is a container on this private compose network at
      # http://keycloak:8080, so the JWKS fetch is plaintext to a non-loopback
      # host -- which the verifier refuses by default, and must keep refusing.
      # Blank (= off) unless auth.env turns it on. Never in a real deployment.
      LATIQ_AUTH_ALLOW_INSECURE_JWKS: ${LATIQ_AUTH_ALLOW_INSECURE_JWKS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:52400/metrics"]
      interval: 3s
      timeout: 5s
      retries: 30

  pond-node-1:
    <<: *latiq
    hostname: pond-node-1
    command: ["node", "add", "--node-id", "node-1", "--bind", "0.0.0.0",
              "--port", "51401", "--advertise-addr", "pond-node-1:51401",
              "--root", "/var/lib/latiq"]
    environment:
      LATIQ_SERVER: http://control-plane:51400
      # The URL agents actually dial: MCP is only reachable through the gateway
      # in this topology, so that is what the node publishes as its RFC 9728
      # `resource` and points its 401 challenge at. A property of the topology,
      # not of auth mode -- hence a plain value, set whether or not auth is on.
      # It is ALSO the MCP `Host` allow-list (rmcp's DNS-rebinding guard is
      # loopback-only by default): unset or wrong here and every JSON-RPC POST
      # through the gateway is a 403, while discovery keeps answering.
      LATIQ_PUBLIC_MCP_URL: http://gateway:51510/mcp
      # Blank unless auth mode. Set by auth.env; a blank issuer = auth off.
      LATIQ_AUTH_ISSUER: ${LATIQ_AUTH_ISSUER:-}
      LATIQ_AUTH_AUDIENCE: ${LATIQ_AUTH_AUDIENCE:-latiq}
      # TEST-ONLY. Keycloak is a container on this private compose network at
      # http://keycloak:8080, so the JWKS fetch is plaintext to a non-loopback
      # host -- which the verifier refuses by default, and must keep refusing.
      # Blank (= off) unless auth.env turns it on. Never in a real deployment.
      LATIQ_AUTH_ALLOW_INSECURE_JWKS: ${LATIQ_AUTH_ALLOW_INSECURE_JWKS:-}
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:52401/metrics"]
      interval: 3s
      timeout: 5s
      retries: 30

  pond-node-2:
    <<: *latiq
    hostname: pond-node-2
    command: ["node", "add", "--node-id", "node-2", "--bind", "0.0.0.0",
              "--port", "51401", "--advertise-addr", "pond-node-2:51401",
              "--root", "/var/lib/latiq"]
    environment:
      LATIQ_SERVER: http://control-plane:51400
      # The URL agents actually dial: MCP is only reachable through the gateway
      # in this topology, so that is what the node publishes as its RFC 9728
      # `resource` and points its 401 challenge at. A property of the topology,
      # not of auth mode -- hence a plain value, set whether or not auth is on.
      # It is ALSO the MCP `Host` allow-list (rmcp's DNS-rebinding guard is
      # loopback-only by default): unset or wrong here and every JSON-RPC POST
      # through the gateway is a 403, while discovery keeps answering.
      LATIQ_PUBLIC_MCP_URL: http://gateway:51510/mcp
      # Blank unless auth mode. Set by auth.env; a blank issuer = auth off.
      LATIQ_AUTH_ISSUER: ${LATIQ_AUTH_ISSUER:-}
      LATIQ_AUTH_AUDIENCE: ${LATIQ_AUTH_AUDIENCE:-latiq}
      # TEST-ONLY. Keycloak is a container on this private compose network at
      # http://keycloak:8080, so the JWKS fetch is plaintext to a non-loopback
      # host -- which the verifier refuses by default, and must keep refusing.
      # Blank (= off) unless auth.env turns it on. Never in a real deployment.
      LATIQ_AUTH_ALLOW_INSECURE_JWKS: ${LATIQ_AUTH_ALLOW_INSECURE_JWKS:-}
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:52401/metrics"]
      interval: 3s
      timeout: 5s
      retries: 30

  # The 3rd node — started at runtime by the scale-out test to prove dynamic
  # scale-up (a new pond lands on it and queries route there).
  pond-node-3:
    <<: *latiq
    hostname: pond-node-3
    profiles: ["scale"]
    command: ["node", "add", "--node-id", "node-3", "--bind", "0.0.0.0",
              "--port", "51401", "--advertise-addr", "pond-node-3:51401",
              "--root", "/var/lib/latiq"]
    environment:
      LATIQ_SERVER: http://control-plane:51400
      # The URL agents actually dial: MCP is only reachable through the gateway
      # in this topology, so that is what the node publishes as its RFC 9728
      # `resource` and points its 401 challenge at. A property of the topology,
      # not of auth mode -- hence a plain value, set whether or not auth is on.
      # It is ALSO the MCP `Host` allow-list (rmcp's DNS-rebinding guard is
      # loopback-only by default): unset or wrong here and every JSON-RPC POST
      # through the gateway is a 403, while discovery keeps answering.
      LATIQ_PUBLIC_MCP_URL: http://gateway:51510/mcp
      # Blank unless auth mode. Set by auth.env; a blank issuer = auth off.
      LATIQ_AUTH_ISSUER: ${LATIQ_AUTH_ISSUER:-}
      LATIQ_AUTH_AUDIENCE: ${LATIQ_AUTH_AUDIENCE:-latiq}
      # TEST-ONLY. Keycloak is a container on this private compose network at
      # http://keycloak:8080, so the JWKS fetch is plaintext to a non-loopback
      # host -- which the verifier refuses by default, and must keep refusing.
      # Blank (= off) unless auth.env turns it on. Never in a real deployment.
      LATIQ_AUTH_ALLOW_INSECURE_JWKS: ${LATIQ_AUTH_ALLOW_INSECURE_JWKS:-}
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:52401/metrics"]
      interval: 3s
      timeout: 5s
      retries: 30

  # The query gateway: the single front door clients hit. Spreads Data+Stream
  # gRPC (:51500) and MCP HTTP (:51510) across the pond nodes; the greeter forwards
  # by pond. This is the prod/k8s topology — clients never know a pod address.
  gateway:
    image: nginx:1.27
    hostname: gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "51500:51500"   # Data + Stream gRPC (CLI/SDK front door)
      - "51510:51510"   # MCP HTTP (agent front door)
    depends_on:
      pond-node-1: { condition: service_healthy }
      pond-node-2: { condition: service_healthy }

  # ---- Internal testing/observability only: Prometheus + a local Iceberg REST +
  # MinIO (S3) catalog. Behind the `test` profile, so a plain `docker compose up`
  # (the external-user path) is just control plane + pond nodes + gateway. Bring
  # these up with `--profile test` (or by naming them) for the catalog/obs e2e.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["test"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [control-plane, pond-node-1, pond-node-2]

  minio:
    image: minio/minio
    profiles: ["test"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

  mc:
    image: minio/mc
    profiles: ["test"]
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set m http://minio:9000 admin password; do sleep 1; done;
      mc mb --ignore-existing m/warehouse;
      exit 0;"

  iceberg-rest:
    image: apache/iceberg-rest-fixture
    profiles: ["test"]
    ports: ["8181:8181"]
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  # One-shot CLI helper: runs inside the network so it can resolve pond-node-N and
  # talk to the control plane. `docker compose run --rm cli <args>`.
  cli:
    <<: *latiq
    restart: "no"
    profiles: ["tools"]
    entrypoint: ["latiq"]
    environment:
      LATIQ_SERVER: http://control-plane:51400
    depends_on: [control-plane, pond-node-1, pond-node-2]

  # ---- Auth mode (nightly + container only). Behind the `auth` profile, and the
  # servers only turn auth on when LATIQ_AUTH_ISSUER is non-blank. Both are set by
  # `docker compose --env-file auth.env ...` (which also sets COMPOSE_PROFILES=auth).
  #
  # Keycloak is in-network and every party — pond nodes, control plane, and the two
  # test runners below — uses the SAME issuer URL `http://keycloak:8080/realms/latiq`
  # via Docker DNS. No host-vs-container address split to reconcile.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    hostname: keycloak
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      # Pins the `iss` claim. Every party uses this exact URL.
      KC_HOSTNAME_URL: http://keycloak:8080
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    # No published ports: nothing outside the network needs to reach it. Add
    # `ports: ["8080:8080"]` temporarily if you want the admin console.

  # One-shot in-network SDK auth tests: installs the built wheel from /repo/dist
  # and runs the auth suite against the gateway. Like `cli`, it runs on the compose
  # network so `gateway`, `control-plane` and `keycloak` all resolve.
  auth-tests-sdk:
    image: python:3.11-slim
    restart: "no"
    profiles: ["auth"]
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      LATIQ_AUTH_ISSUER: ${LATIQ_AUTH_ISSUER:-}
      LATIQ_GATEWAY: gateway:51500
      LATIQ_SERVER: http://control-plane:51400
    entrypoint: ["/bin/sh", "-c"]
    # `--no-index` is load-bearing: without it a missing/stale wheel in
    # /repo/dist silently falls back to PyPI, and the auth suite would go green
    # against the PUBLISHED latiq instead of this branch's code.
    #
    # These notes are YAML comments, NOT lines of the folded scalar below: `>-`
    # joins its lines with SPACES, so a `#` anywhere in it commented out the
    # whole command. `sh -c '# … pip install … && pytest …'` runs nothing and
    # exits 0 — the nightly's `SDK auth e2e` step was green without ever
    # installing the wheel or running a test. Keep prose out of the scalar.
    #
    # `--latiq-mode=auth` fails the run if the auth tests were skipped instead of
    # executed (e.g. LATIQ_AUTH_ISSUER not reaching the container) — see
    # e2e/sdk/conftest.py.
    command:
      - >-
        pip install --no-cache-dir --no-index --find-links /repo/dist latiq &&
        pip install --no-cache-dir -r /repo/e2e/sdk/requirements.txt &&
        pytest /repo/e2e/sdk/test_auth.py -v --latiq-mode=auth
    depends_on: [gateway, keycloak]

  # One-shot in-network MCP agent auth tests (the agent harness is Node).
  auth-tests-agent:
    image: node:22-slim
    restart: "no"
    profiles: ["auth"]
    working_dir: /repo/e2e/agent
    volumes:
      - ../..:/repo
    environment:
      LATIQ_AUTH_ISSUER: ${LATIQ_AUTH_ISSUER:-}
      LATIQ_MCP: http://gateway:51510/mcp
      LATIQ_SERVER: http://control-plane:51400
    entrypoint: ["/bin/sh", "-c"]
    command: ["npm ci && npm test"]
    depends_on: [gateway, keycloak]
