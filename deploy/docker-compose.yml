# Latiq — the minimal, self-contained deployment for external users. References
# only PUBLISHED images (GHCR + Docker Hub) — no inline configs, no file mounts —
# so it runs with NO repo clone and identically under Docker AND Podman:
#
#   curl -O https://raw.githubusercontent.com/neonexia/latiq/main/deploy/docker-compose.yml
#   docker compose up -d      # (or: podman compose up -d)
#
# Then:
#   agents  → http://localhost:51510/mcp   (MCP; no SDK)
#   sdk/cli → localhost:51500 (Data/Stream gRPC) · localhost:51400 (Control/Admin)
#   pip install latiq   → db = latiq.connect("grpc://localhost:51400",
#                                             query_gateway="grpc://localhost:51500")
#
# Defaults to the RELEASE (0.1.0), not :nightly — what a user gets by curling this
# file must be a version someone decided to ship, not whatever last night's main
# built. Override either image to move: LATIQ_IMAGE / LATIQ_GATEWAY_IMAGE take a
# newer release, or `:nightly` to track main. Bump these defaults with the tag.
# This is the lean topology (control plane + 2 pond nodes + gateway); the full
# test/dev stack (Prometheus/MinIO/Iceberg, scale-out) lives in deploy/cluster
# (repo only).
x-latiq: &latiq
  image: ${LATIQ_IMAGE:-ghcr.io/neonexia/latiq:0.1.0}
  restart: unless-stopped

services:
  control-plane:
    <<: *latiq
    hostname: control-plane
    command: ["serve", "--bind", "0.0.0.0", "--port", "51400", "--root", "/var/lib/latiq"]
    ports: ["51400:51400"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:52400/metrics"]
      interval: 3s
      timeout: 5s
      retries: 30

  pond-node-1:
    <<: *latiq
    hostname: pond-node-1
    command: ["node", "add", "--node-id", "node-1", "--bind", "0.0.0.0",
              "--port", "51401", "--advertise-addr", "pond-node-1:51401",
              "--root", "/var/lib/latiq"]
    environment:
      LATIQ_SERVER: http://control-plane:51400
      # The URL agents actually dial. MCP is reachable only through the gateway
      # here, so the node publishes that as its RFC 9728 `resource` and in its
      # 401 challenge -- a client that discovers this node's own address would
      # refuse it as a different origin. It is ALSO the MCP `Host` allow-list
      # (rmcp's DNS-rebinding guard is loopback-only by default), so it must
      # name the host agents send. Override when you expose the gateway under a
      # public name (e.g. https://latiq.example.com/mcp).
      LATIQ_PUBLIC_MCP_URL: ${LATIQ_PUBLIC_MCP_URL:-http://localhost:51510/mcp}
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:52401/metrics"]
      interval: 3s
      timeout: 5s
      retries: 30

  pond-node-2:
    <<: *latiq
    hostname: pond-node-2
    command: ["node", "add", "--node-id", "node-2", "--bind", "0.0.0.0",
              "--port", "51401", "--advertise-addr", "pond-node-2:51401",
              "--root", "/var/lib/latiq"]
    environment:
      LATIQ_SERVER: http://control-plane:51400
      # The URL agents actually dial. MCP is reachable only through the gateway
      # here, so the node publishes that as its RFC 9728 `resource` and in its
      # 401 challenge -- a client that discovers this node's own address would
      # refuse it as a different origin. It is ALSO the MCP `Host` allow-list
      # (rmcp's DNS-rebinding guard is loopback-only by default), so it must
      # name the host agents send. Override when you expose the gateway under a
      # public name (e.g. https://latiq.example.com/mcp).
      LATIQ_PUBLIC_MCP_URL: ${LATIQ_PUBLIC_MCP_URL:-http://localhost:51510/mcp}
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:52401/metrics"]
      interval: 3s
      timeout: 5s
      retries: 30

  gateway:
    image: ${LATIQ_GATEWAY_IMAGE:-ghcr.io/neonexia/latiq-gateway:0.1.0}
    hostname: gateway
    ports:
      - "51500:51500"   # Data + Stream gRPC (SDK/CLI front door)
      - "51510:51510"   # MCP HTTP (agent front door)
    depends_on:
      pond-node-1: { condition: service_healthy }
      pond-node-2: { condition: service_healthy }
